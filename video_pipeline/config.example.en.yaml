# Video pipeline config example (English)
topic: "Fall camping vlog highlights"
num_scenes: 5
language: "en"   # narration language: "en" | "ko" (used by mock/anthropic script_provider)
aspect_ratios: ["9:16", "1:1", "16:9"]
output_dir: "output"

# All 4 stages below are independently swappable: mock <-> real service
script_provider: mock        # mock | anthropic
image_provider: mock         # mock | openai
video_provider: local_kenburns  # local_kenburns (free/local) | http_generic (Runway/Kling/Pika/Higgsfield-style REST API)
tts_provider: mock           # mock | openai

providers:
  # script_provider: anthropic uses the official anthropic SDK.
  # Credentials are resolved automatically from ANTHROPIC_API_KEY or an `ant auth login` profile.
  anthropic:
    model: "claude-opus-5"

  openai_image:
    model: "dall-e-3"
    size: "1024x1792"

  openai_tts:
    model: "tts-1"
    voice: "alloy"

  local_kenburns:
    fps: 30

  # Example for video_provider: http_generic. Swap base_url / api_key_env / field names
  # to point at Runway, Kling, Pika, Luma, Higgsfield, or any other image-to-video vendor.
  http_generic:
    base_url: "https://api.example-video-ai.com/v1"
    api_key_env: "VIDEO_API_KEY"
    create_field_map:
      model: "default"
      duration: 4
    poll_field: "id"
    status_field: "status"
    result_field: "output_url"
    done_values: ["succeeded", "completed"]

  # background_music: "assets/bgm.mp3"
