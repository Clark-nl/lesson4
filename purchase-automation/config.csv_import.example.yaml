# 복사 후 config.yaml 로 저장하고 값을 조정하세요.
# 네덜란드(EU) 시장 판매용 프로필: API/구독료 전혀 없이 CSV 파일만으로 추천받기
#
# 사용법: Syncee/dropXL/도매 사이트 어디서든 상품 목록을 CSV로 내려받거나
# (또는 직접 엑셀로 후보 상품 목록을 만들어) CSV_IMPORT_SOURCE 환경변수에
# 그 파일 경로나 공개 URL(Dropbox 다이렉트 링크, Google Sheets를 CSV로
# 게시한 링크 등)을 지정하면 됩니다. 컬럼명이 다르면 이 파일의 column_map
# 대신 platforms/csv_import.py 생성 시 넘기는 column_map으로 조정하세요.
# 자격 증명이 전혀 필요 없습니다 - 비용 0원.
# 금액 단위: 파일에 적힌 통화 그대로 (보통 EUR)

platform: csv_import  # purchase_pipeline/platforms/ 에 등록된 커넥터 이름

channels:
  - shopify
  - amazon_nl
  - amazon_de

output_dir: output/csv_import

scoring:
  min_margin_rate: 0.20
  min_stock_qty: 3
  top_n: 50
  # CSV 파일에는 보통 판매량 데이터가 없으므로 마진율에만 가중치를 둡니다.
  margin_weight: 1.0
  demand_weight: 0.0

# 채널별 수수료 추정치 (EUR). 실제 계약/카테고리별 수수료율로 조정하세요.
channel_fees:
  shopify:
    commission_rate: 0.0
    payment_fee_rate: 0.015
    fixed_fee: 0.25
  amazon_nl:
    commission_rate: 0.15
    payment_fee_rate: 0.0
    fixed_fee: 0
  amazon_de:
    commission_rate: 0.15
    payment_fee_rate: 0.0
    fixed_fee: 0
