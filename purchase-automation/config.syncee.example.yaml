# 복사 후 config.yaml 로 저장하고 값을 조정하세요.
# 네덜란드(EU) 시장 판매용 프로필: Syncee (최대한 무료/저비용 지향)
#
# 중요: Syncee는 서버가 호출할 수 있는 API가 없습니다 (Shopify 앱으로 상품을
# 스토어에 직접 동기화하는 방식). 그래서 이 프로필은 Syncee API를 호출하지
# 않고, Syncee가 이미 동기화해 둔 "내 Shopify 스토어 카탈로그"를 그대로
# 읽어서(원가는 Shopify의 "Cost per item" 필드) 어떤 상품을 Amazon.nl/de에도
# 올릴 가치가 있는지 스코어링합니다. 즉 이 파이프라인 입장에서 추가로 드는
# 플랫폼 비용은 0원이고, Shopify 계정(이미 있음)과 Syncee 무료/저가 플랜만
# 있으면 됩니다.
#
# 그래서 channels에 "shopify"를 넣지 않습니다 - 스토어 자체가 소스이고,
# Amazon.nl/de가 "이 중 뭘 더 팔까"를 결정하는 대상입니다.
#
# 자격 증명은 여기 넣지 말고 환경 변수 또는 GitHub Actions Secrets 로 관리합니다.
# (SHOPIFY_SHOP / SHOPIFY_ACCESS_TOKEN - shopify_exporter.py와 동일한 값)
# 금액 단위: EUR

platform: syncee  # purchase_pipeline/platforms/ 에 등록된 커넥터 이름

channels:
  - amazon_nl
  - amazon_de

output_dir: output/syncee

scoring:
  min_margin_rate: 0.20   # EU 채널 수수료가 높아 최소 마진율을 더 보수적으로 설정
  min_stock_qty: 3
  top_n: 50
  # Shopify 카탈로그에는 판매량 데이터가 따로 없으므로 마진율에만 가중치를 둡니다.
  # (원한다면 Shopify Orders API를 추가로 연동해 sold_last_30d를 채울 수 있습니다.)
  margin_weight: 1.0
  demand_weight: 0.0

# 채널별 수수료 추정치 (EUR). 실제 계약/카테고리별 수수료율로 조정하세요.
channel_fees:
  amazon_nl:
    commission_rate: 0.15     # Amazon 카테고리별 추천 수수료(referral fee) 평균치
    payment_fee_rate: 0.0
    fixed_fee: 0
  amazon_de:
    commission_rate: 0.15
    payment_fee_rate: 0.0
    fixed_fee: 0
