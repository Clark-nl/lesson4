name: Purchase List Pipeline

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST / 02:00 CEST(네덜란드 서머타임 기준)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  generate-purchase-list:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 한국 판매 채널(쿠팡/네이버/이베이 + 자사몰) - 오너클랜 소싱
          - label: ownerclan-kr
            config: config.ownerclan.example.yaml
            shopify_shop_secret: SHOPIFY_SHOP_KR
            shopify_token_secret: SHOPIFY_ACCESS_TOKEN_KR
          # 네덜란드/EU 판매 채널(Amazon.nl/Amazon.de) - Syncee 소싱
          # (최대한 무료로: Syncee는 서버 API가 없어 별도 플랫폼 API 비용이 0원 -
          #  이미 있는 Shopify 스토어 카탈로그를 읽어서 스코어링함. 비용 대신
          #  카테고리 무관/전용 API가 필요하면 config.dropxl.example.yaml(월 30유로)
          #  또는 config.bigbuy.example.yaml(월 69~99유로)로 이 항목을 바꾸면 됨)
          - label: syncee-nl
            config: config.syncee.example.yaml
            shopify_shop_secret: SHOPIFY_SHOP_NL
            shopify_token_secret: SHOPIFY_ACCESS_TOKEN_NL
    defaults:
      run:
        working-directory: purchase-automation
    env:
      OWNERCLAN_CLIENT_ID: ${{ secrets.OWNERCLAN_CLIENT_ID }}
      OWNERCLAN_CLIENT_SECRET: ${{ secrets.OWNERCLAN_CLIENT_SECRET }}
      BIGBUY_API_KEY: ${{ secrets.BIGBUY_API_KEY }}
      DROPXL_FEED_URL: ${{ secrets.DROPXL_FEED_URL }}
      DROPXL_API_KEY: ${{ secrets.DROPXL_API_KEY }}
      SHOPIFY_SHOP: ${{ secrets[matrix.shopify_shop_secret] }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets[matrix.shopify_token_secret] }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Run purchase list pipeline (${{ matrix.label }})
        run: PYTHONPATH=src python -m purchase_pipeline.pipeline --config ${{ matrix.config }}

      - name: Upload purchase list artifacts (${{ matrix.label }})
        uses: actions/upload-artifact@v4
        with:
          name: purchase-list-${{ matrix.label }}-${{ github.run_id }}
          path: purchase-automation/output/
          retention-days: 30
