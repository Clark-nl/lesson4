name: Purchase List Pipeline

on:
  schedule:
    # 매일 00:00 UTC = 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  generate-purchase-list:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: purchase-automation
    env:
      OWNERCLAN_CLIENT_ID: ${{ secrets.OWNERCLAN_CLIENT_ID }}
      OWNERCLAN_CLIENT_SECRET: ${{ secrets.OWNERCLAN_CLIENT_SECRET }}
      SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP }}
      SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q

      - name: Run purchase list pipeline
        run: PYTHONPATH=src python -m purchase_pipeline.pipeline --config config.example.yaml

      - name: Upload purchase list artifacts
        uses: actions/upload-artifact@v4
        with:
          name: purchase-list-${{ github.run_id }}
          path: purchase-automation/output/
          retention-days: 30
